[workspace]
members = ["."]
resolver = "2"

[package]
name = "herdr-mission"
version = "0.1.4"
edition = "2021"
rust-version = "1.88.0"
publish = false

[lib]
name = "herdr_mission"
path = "src/lib.rs"

[[bin]]
name = "herdr-mission"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8"
ratatui = "0.30"
crossterm = "0.29"
throbber-widgets-tui = "0.11.1"
