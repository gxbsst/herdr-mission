name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Stage asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/herdr-mission" "dist/herdr-mission-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-mission-${{ matrix.target }}
          path: dist/herdr-mission-${{ matrix.target }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build checksum and commit marker
        run: |
          cd dist
          sha256sum herdr-mission-* > SHA256SUMS
          git -C .. rev-parse HEAD | tr -d '\n' > COMMIT
          cat SHA256SUMS
          cat COMMIT

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/herdr-mission-*
            dist/SHA256SUMS
            dist/COMMIT
